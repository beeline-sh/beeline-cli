name: release

# Tag `vX.Y.Z` on main to publish binaries; the install script at
# https://beeline.sh/install picks the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X go.beeline.sh/cli/internal/config.Version=$ver" -o "dist/beeline$ext" ./cmd/beeline
          name="beeline_${ver}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then
            (cd dist && zip -q "../$name.zip" "beeline$ext")
          else
            tar -czf "$name.tar.gz" -C dist "beeline$ext"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: beeline_*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: (cd artifacts && sha256sum beeline_* > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
